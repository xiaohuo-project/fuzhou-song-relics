<script>
var RECS = [{"id": "FZ-0001", "name": "宦溪窑址", "type": "窑址", "dynasty": "宋", "dynasty_detail": "宋（部分元代器物）", "location_text": "北峰宦溪乡硋砧村和板桥村", "modern_loc": "晋安区宦溪镇", "description": "废窑堆积分布于城里坪、弟哥、崎坪顶、釉池谷及新厝村后门山、坂桥村新厝山等处，范围约2万平方米。产品以青瓷居多，兼烧青白瓷与少量黑釉瓷，装饰见莲瓣、荷花、贴花缠枝牡丹，生产年代在南宋晚期至元代。", "quote": "历年来，从宦溪窑址出土的遗物相当丰富，主要有匣钵、垫饼、垫柱、支圈等窑具和各种日用器皿。采集到的标本有碗、壶、钵、罐、瓶、碟、炉、盒、盖和灯盏、托杯、注子，而以碗居多。这些瓷器的釉色以青釉为主，辅以黄釉，有部分白釉，还有少量的黑釉。装饰技法有刻花、印花和划花。纹饰方面有荷花、菊花、弦纹、划纹、莲花纹等。经鉴定，主要为宋代遗物，部分为元代器物，这对研究宋元瓷业生产和福州地区瓷器的发展有一定的价值。", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "窑址南北长1.7公里，相传有36窑；1983年列为市第二批文保。；合并同名 2 条（宦溪窑址(窑址)）", "docs": ["2C29TGJD", "FETUHMJS", "N7FYCUDW"], "lon": 119.3561398, "lat": 26.1780143, "precision": "乡镇级", "geo_query": "宦溪镇, 晋安区", "geo_basis": "宦溪中学, 新贵线, 过山, 晋安区, 福州市, 福建省, 350012, 中国", "dup_n": 4, "dup_i": 1, "dup_names": "宦溪窑址、降虎桥、宦溪窑、洋坑村“天香台”摩崖石刻"}, {"id": "FZ-0002", "name": "长柄窑址", "type": "窑址", "dynasty": "宋", "dynasty_detail": "宋", "location_text": "亭江镇长柄村东北一公里砾砧仓", "modern_loc": "马尾区亭江镇", "description": "1985年文物普查时发现，至今未发掘。采集青瓷、黑釉瓷，黑釉盏造型近建盏，是闽江口一带宋代外销瓷窑址代表。", "quote": "青瓷以灰青为主，器物中有敞口圈足碗、碟、器盖等，质地细腻。黑釉瓷有双耳执壶、盏等。盏为敞口，斜壁，小圈足，通高5厘米，口径11厘米，足径3.7厘米，釉面光亮，色黑如漆，造型风格与“建盏”相似。据鉴定，该窑址出土器物为宋代烧制。", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "1986年列为福州郊区第一批文保。", "docs": ["FETUHMJS"], "lon": 119.5065845, "lat": 26.0717718, "precision": "乡镇级", "geo_query": "亭江镇, 马尾区", "geo_basis": "亭江镇, 马尾区, 福州市, 福建省, 中国", "dup_n": 12, "dup_i": 1, "dup_names": "长柄窑址、迥龙桥（飞盖桥、沈公桥）、闽安龙门摩崖石刻、盛美村状元帽砌阶摩崖石刻"}, {"id": "FZ-0003", "name": "洪塘陶窑址", "type": "窑址", "dynasty": "宋", "dynasty_detail": "宋", "location_text": "南台岛北端硋山", "modern_loc": "仓山区（福建农林大学一带）", "description": "1983年初福建省农学院基建时发现，文化堆积厚1至4米，采集小口鼓腹罐、执壶、砂锅等陶器30余件，为南台岛宋代陶窑实证。", "quote": "陶窑址濒临乌龙江，由东往西绵延数百米。其西北隅断壁所暴露的文化堆积层厚达1—4米不等。采集到的陶制器物有小口鼓腹罐、直口短流壶、直口宽把壶、钵、砂锅、垫饼等30余件。经鉴定，系宋代烧制。", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "", "docs": ["FETUHMJS"], "lon": 119.2943837, "lat": 26.0406598, "precision": "地名点", "geo_query": "南台, 仓山区", "geo_basis": "仓山区中医院, 上渡路, 南台新苑·梅花园, 上渡街道, 仓山区, 福州市, 福建省, 350007, 中国", "dup_n": 1, "dup_i": 1, "dup_names": "洪塘陶窑址"}, {"id": "FZ-0004", "name": "福州茶园村宋墓", "type": "墓葬", "dynasty": "宋", "dynasty_detail": "南宋（端平乙未，1235年）", "location_text": "北郊茶园山东麓", "modern_loc": "鼓楼区茶园山", "description": "福州北郊茶园村南宋夫妻合葬墓，1986年8月发掘。出土丝织品400余件、雕漆4件及金银铜器等近五百件，帛幡墨书落款“端平乙未仲冬吉日”，可定下葬于端平二年。", "quote": "宋代墓葬的棺椁相套形制在福建较为罕见，它是我省通过科学发掘首次发现男女尸双双保存完好的宋墓。", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "原文称其为福建首次科学发掘、男女尸双双保存完好的宋墓。；合并同名 1 条（茶园村宋墓(墓葬)）", "docs": ["FETUHMJS", "TLQ3L5WK"], "lon": 119.27623, "lat": 26.07955, "precision": "POI锚点（腾讯·人工判词）", "geo_query": "茶园山", "geo_basis": "人工判词｜茶园山(鼓楼洪山镇)｜腾讯地图 POI 锚点", "dup_n": 2, "dup_i": 1, "dup_names": "福州茶园村宋墓、茶园山南宋墓"}, {"id": "FZ-0005", "name": "福州茶园山许峻墓", "type": "墓葬", "dynasty": "宋", "dynasty_detail": "南宋淳祐十年（1250年）", "location_text": "福州西郊茶园山西麓茶园山小学校园内", "modern_loc": "鼓楼区茶园山（茶园山小学）", "description": "1990年3月在福州茶园山清理的宋墓，出土“宋孺人陈氏墓志铭”，志文由郑性之撰并书，与闽安南宋碑刻的官衔记载互为印证，是南宋福州职官与碑刻断代的重要参照。", "quote": "墓南向偏西45度，封土为三合土质，封顶残高60厘米。封土内有三个墓室并列，砖石结构。每室四周均用大型条石构筑，室内四面再用若干块长27.5厘米、宽11厘米、厚8.2厘米的青砖叠砌，部分砖头阳刻“淳祐十年”四字楷书，在条石与青砖之间用松香填塞。墓室底部铺两层预制长条砖板，每块砖板长129.5厘米，宽29厘米，厚9.5厘米。墓室顶部有9块预制长条砖板，其上又覆盖长条石板；在石板与三合土封顶之间施一层厚", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "墓主许峻1223—1272，许应龙子，见附传。；合并同名 1 条（福州茶园山许峻墓(墓葬)）", "docs": ["233J2SQS", "FETUHMJS"], "lon": 119.2958585, "lat": 26.1132388, "precision": "地名点", "geo_query": "山小学校, 鼓楼区", "geo_basis": "福州市屏山小学, 魁炉头巷, 华大街道, 鼓楼区, 福州市, 福建省, 350003, 中国", "dup_n": 1, "dup_i": 1, "dup_names": "福州茶园山许峻墓"}, {"id": "FZ-0006", "name": "黄榦墓", "type": "墓葬", "dynasty": "宋", "dynasty_detail": "南宋", "location_text": "北峰长箕岭苞牺谷，岭头乡江南竹村西南500米处", "modern_loc": "晋安区岭头（今属寿山乡）", "description": "南宋理学家黄榦卒后葬此，墓建于南宋，清光绪九年重修，外观平面呈『风』字形，三合土结构，墓碑楷书『宋大儒黄公勉斋墓』，坟前墓埕四层，是福州保存较完整的南宋理学家墓葬。", "quote": "黄榦墓在北峰长箕岭苞牺谷，位于岭头乡江南竹村西南500米处的山垅中。墓为三合土结构，西向，平面呈“风”字形，四层墓埕。面宽6.6米，纵深11米。封土呈覆钵形，直径3米。墓碑楷书“宋大儒勉斋黄公墓”八字。墓埕前竖立一块高1.13米、宽0.44米、厚0.16米的石碑，碑面楷书：“清光绪癸未奉宪领款重修。裔孙心年、宸书监工。”", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "合并同名 1 条（黄榦墓(墓葬)）", "docs": ["FETUHMJS", "N7FYCUDW"], "lon": 119.30854, "lat": 26.19655, "precision": "POI锚点（腾讯·人工判词）", "geo_query": "江南竹村", "geo_basis": "人工判词｜江南竹村(晋安寿山乡)｜腾讯地图 POI 锚点", "dup_n": 1, "dup_i": 1, "dup_names": "黄榦墓"}, {"id": "FZ-0007", "name": "福州浮仓山赵與骏墓（黄升墓）", "type": "墓葬", "dynasty": "宋", "dynasty_detail": "南宋淳祐九年（1249年）", "location_text": "北郊新店乡浮仓山巅", "modern_loc": "晋安区新店镇浮仓山", "description": "1975年10月福州第七中学扩建操场时发现，为一穴三圹并列的石圹砖椁墓，出土服饰、纺织品等随葬器物436件，即著名的福州南宋黄升墓，是福建宋代考古最重要的收获之一，为宋代服饰与纺织史提供标准器群。", "quote": "中间为将仕郎赵与骏的墓室，赵与骏卒于淳祐九年（1249年），葬具已腐朽。出土铜镜两面，一为素面六边葵形镜，一为凤纹圆镜。", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "墓室2.94×1.44×1.46米；黄升墓志与买地券是南宋福州纪年标准器物。；合并同名 4 条（浮仓山南宋墓（黄升墓）(墓葬)、福州黄昇墓(墓葬)、黄升墓(墓葬)、黄昇墓(墓葬)）", "docs": ["4H2RDBID", "5MF3TYLJ", "FETUHMJS", "N7FYCUDW", "TIXTW2GI"], "lon": 119.306605, "lat": 26.1306809, "precision": "乡镇级", "geo_query": "新店镇, 晋安区", "geo_basis": "新店镇人民政府, 磐石路, 晋安区, 福州市, 福建省, 350003, 中国", "dup_n": 5, "dup_i": 1, "dup_names": "福州浮仓山赵與骏墓（黄升墓）、福州北郊摩崖石刻、福州朱著墓、福州晋安区新店罗汉山遗址宋墓（M13、M14）"}, {"id": "FZ-0008", "name": "琅岐驸马墓", "type": "墓葬", "dynasty": "宋", "dynasty_detail": "宋（相传林存墓）", "location_text": "琅岐乡龙台村东南侧", "modern_loc": "马尾区琅岐镇龙台村", "description": "土石结构墓，1958年被破坏，墓道前尚存文官、武将石翁仲二尊，高370与380厘米。相传为宋林存墓，然文献与实物均难证实。", "quote": "驸马墓，在琅岐乡龙台村东南侧。墓为土石结构，1958年被破坏。墓道前尚存二尊石翁仲。翁仲立于村口榕树下，文官高冠，身穿长袍，秉笏而立，高370厘米，宽100厘米，厚45厘米。武将身披盔甲，双手执剑，高380厘米，宽91厘米，厚45厘米。相传此墓是宋代林存墓，且有生动的民间传说。（图38）", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "low", "note": "原文自述林存招驸马被杀之说无史实根据，且是否为林存墓尚待考证。", "docs": ["FETUHMJS"], "lon": 119.5732149, "lat": 26.0861662, "precision": "乡镇级", "geo_query": "琅岐镇, 马尾区", "geo_basis": "琅岐镇, 马尾区, 福州市, 福建省, 中国", "dup_n": 1, "dup_i": 1, "dup_names": "琅岐驸马墓"}, {"id": "FZ-0009", "name": "怀安衙署遗址", "type": "建筑基址", "dynasty": "宋-明清明清追溯", "dynasty_detail": "宋咸平二年（999年）移治，现存建筑明末清初", "location_text": "建新乡怀安村石岊山南麓", "modern_loc": "仓山区建新镇怀安（淮安）村", "description": "宋太平兴国六年置怀安县，咸平二年移治石岊。现存三进石木结构房屋主体为明末清初建筑，庭院条石、一进地面石板及围墙基石疑为宋代遗物，迎官道残梁刻伍贯文造桥。", "quote": "衙署坐北向南，现为民居，石木结构，三进，面宽18.2米，进深60米。房屋主体结构为明末清初建筑，庭院条石、一进地面石板及围墙基石疑为宋代遗物。", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "medium", "note": "宋代为追溯，依据是构件与地面遗存；面宽18.2米、进深60米。", "docs": ["FETUHMJS"], "lon": 119.226287, "lat": 26.094974, "precision": "POI锚点（腾讯）", "geo_query": "怀安衙署遗址", "geo_basis": "POI锚点(腾讯)｜怀安衙署遗址｜旅游景点:纪念馆｜位移 2248 m｜关键词 怀安衙署遗址（遗存名）", "dup_n": 1, "dup_i": 1, "dup_names": "怀安衙署遗址"}, {"id": "FZ-0010", "name": "升山灵岩寺", "type": "寺院塔", "dynasty": "宋", "dynasty_detail": "宋（宣和甲辰，1124年）石槽", "location_text": "新店乡升山", "modern_loc": "晋安区新店镇升山", "description": "始建于南朝陈天嘉三年，唐兴元初立额。现存殿宇为清光绪重建、1985年重修。天井中存宋代石槽一口，外壁楷书宣和甲辰当寺僧师达等字，是寺院宋代沿革的实物证据。", "quote": "寺院依山而建，原规模颇大，占地面积约1万多平方米。现建筑规模较小，但典雅幽静。寺坐北向南，土木结构，前后三个院落，主要建筑有天王殿、大雄宝殿、观音阁等，占地面积586平方米。大殿面阔五间，进深六间，穿斗式木构架，单檐悬山顶。檐柱楹联“千年古刹真福地，万盏明灯朝升山”形象地概括出升山寺的历史和地理位置。天井中存有一口宋代石槽，其长3.71米，宽0.84米，高0.57米，外壁楷书：“宣和甲辰当寺僧师达", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "note": "寺院主体建筑为清代，宋代证据限于石槽等石构件。", "docs": ["FETUHMJS"], "lon": 119.273124, "lat": 26.14348, "precision": "POI锚点（腾讯）", "geo_query": "升山灵岩寺", "geo_basis": "POI锚点(腾讯)｜升山灵岩寺｜旅游景点:寺庙道观｜位移 3632 m｜关键词 升山灵岩寺（遗存名）", "dup_n": 3, "dup_i": 1, "dup_names": "升山灵岩寺、升山摩崖石刻、升山张去惑等题名"}, {"id": "FZ-0011", "name": "西禅寺（怡山长庆寺）", "type": "寺院塔", "dynasty": "宋", "dynasty_detail": "北宋天圣年间营葺，景祐五年（1038年）赐额", "location_text": "洪山乡凤湖村怡山", "modern_loc": "鼓楼区工业路西禅寺", "description": "南朝梁为王霸故居，唐咸通年间建寺。宋天圣中营葺始就，周垣九百丈、居三千人；景祐五年敕号怡山长庆寺，为宋代福州五大禅寺之一。现存建筑为清末以来重建。", "quote": "西禅寺在南朝梁时为王霸故居，隋末毁废。唐咸通七年（866年）秋，观察使李景温招长沙沩山僧大安来居；十年（869年）改名清禅寺，寻又改为延寿禅院。后唐长兴中，闽王王延钧奏名长庆寺。后遭乱兵焚毁，仅存佛殿、经藏、法堂、西僧堂。宋天圣中营葺始就，周垣九百丈，居三千人。有明达、紫翠二亭，奎华阁、放生池诸胜。景祐五年（1038年），敕号怡山长庆寺。政和八年（1118年），少宰余深奏为坟寺，赐额“广因嗣祖”。", "att": "FETUHMJS", "source_title": "福州市郊区文物志", "confidence": "high", "no };
document.getElementById('prec').onchange = function (e) { precOnly = e.target.checked; rebuild(); };

// ---- search
var hitsEl = document.getElementById('hits');
document.getElementById('q').oninput = function (e) {
  qText = e.target.value.trim().toLowerCase();
  hitsEl.innerHTML = ''; rebuild();
  if (!qText) return;
  var got = ALLM.filter(function (m) {
    var r = m._r;
    return ((r.name || '') + (r.modern_loc || '') + (r.location_text || '') + (r.type || ''))
      .toLowerCase().indexOf(qText) >= 0;
  });
  got.sort(function (a, b) { return (a._r.name || '').length - (b._r.name || '').length; });
  got.slice(0, 60).forEach(function (m) {
    var d = document.createElement('div'), r = m._r;
    d.textContent = r.name + '（' + r.type + '·' + (r.precision || '未定位') + '）';
    d.onclick = function () {
      map.setView(m.getLatLng(), 14, {animate: true});
      m.openPopup();
      document.getElementById('drawer').classList.remove('open');
    };
    hitsEl.appendChild(d);
  });
  if (!got.length) hitsEl.innerHTML = '<div style="color:#999">无匹配</div>';
};

// ---- drawer
document.getElementById('op').onclick = function () {
  document.getElementById('drawer').classList.toggle('open');
};
map.on('click', function () { document.getElementById('drawer').classList.remove('open'); });
window.addEventListener('orientationchange', function () {
  setTimeout(function () { map.invalidateSize(); }, 250);
});

showRings = true;
drawBounds();
rebuild();
</script></body></html>
